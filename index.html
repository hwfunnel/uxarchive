async function loadVersionScreens(slot, setId, version) {
  document.getElementById('version-picker-overlay')?.remove();
  toast('화면 불러오는 중...');

  try {
    const setDetail = await api('GET', `/screen-sets/${setId}`);
    if (!setDetail || !setDetail.screens?.length) {
      toast('해당 버전에 화면이 없습니다', 'error');
      return;
    }

    // signed URL 포함 screens 조회
    const screensWithUrl = await api('GET', `/screens?id=${setDetail.screens.map(s=>s.id).join(',')}&include_related=false`);
    const screens = (screensWithUrl || setDetail.screens).sort((a,b)=>(a.order_no||0)-(b.order_no||0));

    // 각 screen에 set 메타 붙이기
    screens.forEach(s => { if (!s.set) s.set = setDetail; });

    // 다른 슬롯 회사 충돌 체크
    const otherSlot = slot === 'A' ? 'B' : 'A';
    const otherCompany = compareCompany[otherSlot];
    const thisCompany = setDetail.company_code;
    if (compareCompany[slot] && compareCompany[slot] !== thisCompany) {
      toast('이미 다른 회사 화면이 있습니다', 'error');
      return;
    }

    // 기존 섹션 교체 여부 확인
    if (compareSections[slot].length > 0) {
      showModal(
        '기존 화면 교체',
        `<p style="font-size:14px;color:var(--text-secondary);line-height:1.7">${slot} 섹션의 기존 화면을 <strong>${version}</strong> 버전으로 교체할까요?<br>기존 화면 ${compareSections[slot].length}장이 삭제됩니다.</p>`,
        () => {
          closeModal();
          compareSections[slot] = screens.slice(0, 50);
          compareCompany[slot] = thisCompany;
          renderCompareCols();
          updateCompareMetaBar();
          toast(`${version} · ${screens.length}장 불러왔습니다`, 'success');
        }
      );
      setTimeout(() => {
        const confirm = document.querySelector('#generic-modal #modal-confirm-btn');
        if (confirm) confirm.textContent = '교체하기';
      }, 50);
    } else {
      compareSections[slot] = screens.slice(0, 50);
      compareCompany[slot] = thisCompany;
      renderCompareCols();
      updateCompareMetaBar();
      toast(`${version} · ${screens.length}장 불러왔습니다`, 'success');
    }
  } catch(e) {
    toast('불러오기 실패: ' + e.message, 'error');
  }
}

// ── AI 화면 분석 실행 ────────────────────────────────────────
async function startAIScreenAnalysis(maxTokens=3000) {
  const sA = compareSections.A;
  const sB = compareSections.B;

  if (!sA.length || !sB.length) {
    toast('A·B 섹션 모두 화면을 추가해주세요', 'error');
    return;
  }

  // 매칭 계산
  const codesA = new Map();
  sA.forEach(s => {
    if (!s.screen_type_code) return;
    if (!codesA.has(s.screen_type_code)) codesA.set(s.screen_type_code, []);
    codesA.get(s.screen_type_code).push(s);
  });
  const codesB = new Map();
  sB.forEach(s => {
    if (!s.screen_type_code) return;
    if (!codesB.has(s.screen_type_code)) codesB.set(s.screen_type_code, []);
    codesB.get(s.screen_type_code).push(s);
  });

  const matchedCodes = [...codesA.keys()].filter(c=>codesB.has(c));
  const unmatchedA = [...codesA.keys()].filter(c=>!codesB.has(c));
  const unmatchedB = [...codesB.keys()].filter(c=>!codesA.has(c));

  const getName = code => state.screenTypes.find(s=>s.code===code)?.name || code;

  // 매칭 0개 → 분석 불가
  if (!matchedCodes.length) {
    showModal('분석 불가',
      `<p style="font-size: 14px;color:var(--text-secondary);line-height:1.7">A·B 섹션에 매칭되는 화면 유형이 없습니다.<br>같은 화면 유형 코드의 화면을 양쪽에 추가해주세요.</p>`,
      ()=>closeModal()
    );
    return;
  }

  // 일부 미매칭 → 다이얼로그
  if (unmatchedA.length || unmatchedB.length) {
    const unmatchedList = [
      ...unmatchedA.map(c=>`A의 '${getName(c)}'`),
      ...unmatchedB.map(c=>`B의 '${getName(c)}'`)
    ].join(', ');

    showModal('일부 화면 미매칭',
      `<div style="font-size: 14px;color:var(--text-secondary);line-height:1.8">
        <p style="margin-bottom:12px">매칭되지 않은 화면이 있습니다:</p>
        <div style="background:var(--gray-50);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:12px;font-size: 14px;color:var(--text-secondary)">${unmatchedList}</div>
        <p style="color:var(--text-tertiary);font-size: 14px">매칭되지 않은 화면은 직접 비교되지 않으며, 전체 플로우 흐름 파악을 위한 참고 자료로만 활용됩니다.<br>매칭된 <strong style="color:var(--text-primary)">${matchedCodes.length}개</strong> 화면을 기준으로 분석을 진행합니다.</p>
      </div>`,
      ()=>{ closeModal(); runAIAnalysis(matchedCodes, codesA, codesB, sA, sB, maxTokens); }
    );
    // 취소 버튼 텍스트 변경
    setTimeout(()=>{
      const footer = document.querySelector('#generic-modal .modal-footer');
      if(footer){ const cancel=footer.querySelector('.btn-secondary'); if(cancel)cancel.textContent='취소'; }
      const confirm = document.querySelector('#generic-modal #modal-confirm-btn');
      if(confirm) confirm.textContent='그래도 분석하기';
    },50);
    return;
  }

  // 전부 매칭 → 바로 실행
  runAIAnalysis(matchedCodes, codesA, codesB, sA, sB, maxTokens);
}

// 실제 AI 분석 실행
async function runAIAnalysis(matchedCodes, codesA, codesB, sA, sB, maxTokens=3000) {
  const resultWrap = document.getElementById('analysis-result-wrap');
  if (!resultWrap) return;

  const extra = getAnalysisExtra();
  const cA = compareCompany.A;
  const cB = compareCompany.B;
  const companyNameA = state.companies.find(c=>c.code===cA)?.name||cA||'A';
  const companyNameB = state.companies.find(c=>c.code===cB)?.name||cB||'B';
  const isSameCompany = cA && cB && cA===cB;
  const getName = code => state.screenTypes.find(s=>s.code===code)?.name || code;
  const versionA = sA[0]?.set?.version ? `${sA[0].set.version} · ${sA[0].set.uploaded_at||''}` : '';
  const versionB = sB[0]?.set?.version ? `${sB[0].set.version} · ${sB[0].set.uploaded_at||''}` : '';

  resultWrap.style.display = 'block';
  resultWrap.innerHTML = `
    <div style="border-top:1px solid var(--border);padding-top:24px;margin-top:8px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        <div class="spinner"></div>
        <span style="font-size:14px;font-weight:500">단일화면 비교 분석 중...</span>
        <span style="font-size: 14px;color:var(--text-tertiary)">${AI_MODEL_LABEL} · 예상 ${Math.round(calcCostEstimate()/1330*100)/100}$ (₩${calcCostEstimate().toLocaleString()})</span>
      </div>
    </div>`;

  // 스크롤
  resultWrap.scrollIntoView({behavior:'smooth',block:'start'});

  try {
    // 매칭된 화면들 쌍으로 구성
    const matchedPairs = matchedCodes.map(code => ({
      code,
      name: getName(code),
      screensA: codesA.get(code)||[],
      screensB: codesB.get(code)||[],
    }));

    // 미매칭 화면 (참고용)
    const refA = sA.filter(s=>!matchedCodes.includes(s.screen_type_code));
    const refB = sB.filter(s=>!matchedCodes.includes(s.screen_type_code));

    // 메시지 구성
    const userContent = [];

    // 매칭 화면 쌍 목록 (컨텍스트용)
    const screenName = matchedPairs.map(p => p.name).join(', ');
    let contextText = `[매칭 화면: ${screenName}]`;
    if (extra) contextText += `\n\n[추가 분석 요청]\n${extra}`;
    if (refA.length||refB.length) contextText += `\n\n[참고 미매칭 화면: A ${refA.length}장, B ${refB.length}장]`;

    userContent.push({type:'text', text: contextText});

    // 이미지 추가: image A (A섹션) → image B (B섹션) 순으로 쌍마다
    for (const pair of matchedPairs) {
      if (matchedPairs.length > 1) userContent.push({type:'text', text:`[${pair.name}]`});
      userContent.push({type:'text', text:`image A — ${companyNameA}`});
      for (const s of pair.screensA) {
        if (s.signed_url) {
          try {
            const b64 = await resizeImageToBase64(s.signed_url);
            userContent.push({type:'image', source:{type:'base64', media_type:'image/png', data:b64}});
          } catch(e) { console.warn('이미지 리사이즈 실패:', s.signed_url, e); }
        }
      }
      userContent.push({type:'text', text:`image B — ${companyNameB}`});
      for (const s of pair.screensB) {
        if (s.signed_url) {
          try {
            const b64 = await resizeImageToBase64(s.signed_url);
            userContent.push({type:'image', source:{type:'base64', media_type:'image/png', data:b64}});
          } catch(e) { console.warn('이미지 리사이즈 실패:', s.signed_url, e); }
        }
      }
    }

    const systemPrompt = PROMPTS.SCREEN_COMPARE_DETAIL(companyNameA, companyNameB, isSameCompany, screenName, versionA, versionB);

    // A 화면 ID 먼저, B 화면 ID 나중 (display_image_urls 순서와 일치)
    const aIds = matchedPairs.flatMap(p => p.screensA.map(s => s.id)).filter(Boolean);
    const bIds = matchedPairs.flatMap(p => p.screensB.map(s => s.id)).filter(Boolean);

    const res = await api('POST', '/ai/analyze', {
      system: systemPrompt,
      messages: [{role:'user', content: userContent}],
      max_tokens: maxTokens,
      analysis_type: 'compare',
      image_ids: [...aIds, ...bIds],
    });

    if (!res) throw new Error('분석 요청 실패');
    const text = res.content?.find(b=>b.type==='text')?.text || '';
    renderAnalysisResult(resultWrap, text, companyNameA, companyNameB, isSameCompany, extra, maxTokens);

  } catch(e) {
    resultWrap.innerHTML = `<div style="border-top:1px solid var(--border);padding-top:24px">
      <div style="color:#C0392B;font-size: 14px;padding:16px;background:#FEF2F1;border-radius:var(--radius-md)">분석 오류: ${e.message}</div>
    </div>`;
  }
}

// 변화 방향 뱃지 변환 (전역)
function changeBadge(val) {
  const v = val.trim();
  if (v.includes('↑') || v.includes('상향') || v.includes('강화') || v.includes('추가')) return `<span style="display:inline-flex;align-items:center;gap:2px;font-size: 14px;font-weight:500;padding:2px 7px;border-radius:3px;background:#EAF3DE;color:#3B6D11">${v}</span>`;
  if (v.includes('↓') || v.includes('하향') || v.includes('축소') || v.includes('감소')) return `<span style="display:inline-flex;align-items:center;gap:2px;font-size: 14px;font-weight:500;padding:2px 7px;border-radius:3px;background:#FCEBEB;color:#A32D2D">${v}</span>`;
  if (v.includes('신규') || v.includes('추가') || v.includes('NEW')) return `<span style="font-size: 14px;font-weight:500;padding:2px 7px;border-radius:3px;background:#E6F1FB;color:#185FA5">${v}</span>`;
  if (v.includes('제거') || v.includes('삭제') || v.includes('없음')) return `<span style="font-size: 14px;font-weight:500;padding:2px 7px;border-radius:3px;background:#F1EFE8;color:#5F5E5A">${v}</span>`;
  if (v.includes('⚠') || v.includes('주의') || v.includes('조건')) return `<span style="font-size: 14px;font-weight:500;padding:2px 7px;border-radius:3px;background:#FAEEDA;color:#854F0B">${v}</span>`;
  if (v.includes('유지') || v.includes('동일')) return `<span style="font-size: 14px;font-weight:500;padding:2px 7px;border-radius:3px;background:#F1EFE8;color:#888780">${v}</span>`;
  return `<span style="font-size: 14px;color:var(--text-secondary)">${v}</span>`;
}

// 마크다운 → 보고서 HTML 변환 (전역)
function md2report(t) {
  const lines = t.split('\n');
  let html = '';
  let inTable = false;
  let tableRows = [];
  let tableHeaders = [];
  let sectionIdx = 0;
  const sectionColors = [
    {num:'#FFF0EB',txt:'#FF4600'},
    {num:'#E6F1FB',txt:'#185FA5'},
    {num:'#EAF3DE',txt:'#3B6D11'},
    {num:'#EEEDFE',txt:'#534AB7'},
  ];
  const flushTable = () => {
    if (!tableRows.length) return;
    const isChangeTable = tableHeaders.some(h => h.includes('변화') || h.includes('유형'));
    let thtml = `<div style="overflow-x:auto;border:0.5px solid var(--border);border-radius:var(--radius-md);background:var(--gray-0);margin-bottom:16px">
      <table style="width:100%;border-collapse:collapse;font-size: 14px;table-layout:auto">
        <thead><tr style="background:var(--gray-50)">`;
    tableHeaders.forEach(h => {
      thtml += `<th style="padding:9px 12px;text-align:left;font-weight:500;font-size: 14px;color:var(--text-secondary);border-bottom:0.5px solid var(--border);white-space:nowrap">${h}</th>`;
    });
    thtml += `</tr></thead><tbody>`;
    tableRows.forEach(row => {
      thtml += `<tr>`;
      row.forEach((cell, ci) => {
        const isChangeCol = isChangeTable && (tableHeaders[ci]?.includes('변화') || tableHeaders[ci]?.includes('유형') || tableHeaders[ci]?.includes('방향'));
        const cellHtml = isChangeCol ? changeBadge(cell) : `<span style="color:var(--text-primary)">${cell}</span>`;
        thtml += `<td style="padding:9px 12px;border-bottom:0.5px solid var(--border);vertical-align:top;line-height:1.5">${cellHtml}</td>`;
      });
      thtml += `</tr>`;
    });
    thtml += `</tbody></table></div>`;
    html += thtml;
    tableRows = []; tableHeaders = []; inTable = false;
  };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('## ')) {
      flushTable();
      const title = line.replace('## ', '').trim();
      const sc = sectionColors[sectionIdx % sectionColors.length];
      sectionIdx++;
      html += `<div style="display:flex;align-items:center;gap:8px;margin:${sectionIdx>1?'24px':'0'} 0 12px">
        <div style="width:22px;height:22px;border-radius:50%;background:${sc.num};color:${sc.txt};font-size: 14px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0">${sectionIdx}</div>
        <div style="font-size:14px;font-weight:500">${title}</div>
      </div>`;
      continue;
    }
    if (line.startsWith('### ')) {
      flushTable();
      html += `<div style="font-size: 14px;font-weight:500;color:var(--text-secondary);margin:12px 0 6px">${line.replace('### ','')}</div>`;
      continue;
    }
    if (line.match(/^\|[-| :]+\|$/)) continue;
    if (line.startsWith('|') && line.endsWith('|')) {
      const cells = line.slice(1,-1).split('|').map(c=>c.trim());
      if (!inTable) { inTable = true; tableHeaders = cells; }
      else { tableRows.push(cells); }
      continue;
    }
    if (inTable && !line.startsWith('|')) { flushTable(); }
    if (line.startsWith('◆ ')) {
      const rest = line.replace('◆ ','');
      const isGood = rest.includes('잘한') || rest.includes('긍정') || rest.includes('강점');
      const isRisk = rest.includes('리스크') || rest.includes('위험') || rest.includes('문제');
      const isInsight = rest.includes('인사이트') || rest.includes('제안') || rest.includes('개선');
      const dotColor = isGood ? '#639922' : isRisk ? '#E24B4A' : isInsight ? '#378ADD' : '#888780';
      html += `<div style="display:flex;align-items:flex-start;gap:8px;padding:10px 14px;background:var(--gray-50);border-radius:var(--radius-md);margin-bottom:6px">
        <div style="width:8px;height:8px;border-radius:50%;background:${dotColor};flex-shrink:0;margin-top:5px"></div>
        <div style="font-size: 14px;font-weight:500;color:var(--text-primary)">${rest}</div>
      </div>`;
      continue;
    }
    if (line.match(/^[-•·] /)) {
      html += `<div style="display:flex;gap:8px;font-size: 14px;color:var(--text-secondary);padding:4px 14px;line-height:1.6">
        <span style="color:var(--text-tertiary);flex-shrink:0">→</span>
        <span>${line.replace(/^[-•·] /,'')}</span>
      </div>`;
      continue;
    }
    if (line.trim()) {
      html += `<div style="font-size: 14px;color:var(--text-secondary);line-height:1.7;margin-bottom:4px;padding:0 2px">${line.replace(/\*\*(.+?)\*\*/g,'<strong style="color:var(--text-primary)">$1</strong>')}</div>`;
    } else {
      html += `<div style="height:8px"></div>`;
    }
  }
  flushTable();
  return html;
}

// 이미지 다운로드 (html2canvas)
async function downloadAnalysisReport() {
  const el = document.getElementById('analysis-report');
  if (!el) return;
  toast('이미지 저장 중...');
  try {
    if (!window.html2canvas) {
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        s.onload=res; s.onerror=rej;
        document.head.appendChild(s);
      });
    }
    const canvas = await html2canvas(el, {scale:2, useCORS:true, backgroundColor:'#ffffff'});
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `AI분석_${new Date().toISOString().slice(0,10)}.png`;
    a.click();
    toast('저장 완료!', 'success');
  } catch(e) { toast('저장 실패: '+e.message, 'error'); }
}

const FLOW_EXCLUDE_CODES = new Set([
  'SPLASH','AD_POPUP','AD_BANNER','EVENT_PAGE','CHATBOT','FAQ','CS',
  'BOTTOM_SHEET','ROADING','TM_BANNER','MAIN','MAIN_ADD','PRD_DESC',

]);

function calcFlowCoverage(screens) {
  const catList = { '약관':0, '인적사항':0, '차량':0, '운전자':0, '보험료특약':0 };
  screens.forEach(s => {
    const cat = FLOW_CATEGORY_MAP[s.screen_type_code];
    if (cat) catList[cat]++;
  });
  const covered = Object.values(catList).filter(v => v > 0).length;
  return { count: covered, total: 5, catList };
}

async function startAIFlowAnalysis(maxTokens) {
  maxTokens = maxTokens || 4000;
  const sA = compareSections.A;
  const sB = compareSections.B;

  if (!sA.length || !sB.length) {
    toast('A·B 섹션 모두 화면을 추가해주세요', 'error');
    return;
  }

  const filterFlow = function(screens) {
    return screens
      .filter(function(s) { return !(s.order_no >= 9000) && !FLOW_EXCLUDE_CODES.has(s.screen_type_code); })
      .sort(function(a, b) { return (a.order_no||0) - (b.order_no||0); });
  };

  const flowA = filterFlow(sA);
  const flowB = filterFlow(sB);

  if (!flowA.length || !flowB.length) {
    toast('정규 플로우 화면이 없습니다. 화면 유형을 확인해주세요.', 'error');
    return;
  }

  await runAIFlowAnalysis(flowA, flowB, maxTokens);
}

async function runAIFlowAnalysis(flowA, flowB, maxTokens) {
  maxTokens = maxTokens || 4000;
  const resultWrap = document.getElementById('flow-result-wrap');
  if (!resultWrap) return;

  const cA = compareCompany.A;
  const cB = compareCompany.B;
  const companyNameA = (state.companies.find(function(c){return c.code===cA;}) || {}).name || cA || 'A';
  const companyNameB = (state.companies.find(function(c){return c.code===cB;}) || {}).name || cB || 'B';
  const isSameCompany = !!(cA && cB && cA === cB);

  // 버전 기반 이전/신규 자동 판단
  const verA = (flowA[0]?.set?.version || '').replace(/[^0-9]/g, '') * 1 || 0;
  const verB = (flowB[0]?.set?.version || '').replace(/[^0-9]/g, '') * 1 || 0;
  const verLabelA = flowA[0]?.set?.version || '';
  const verLabelB = flowB[0]?.set?.version || '';
  // 같은 회사일 때: 낮은 버전 = 이전, 높은 버전 = 신규. 순서가 반대면 swap
  var nameA, nameB, resolvedFlowA, resolvedFlowB, covA, covB;
  if (isSameCompany && verA > verB) {
    // A가 더 최신 → swap해서 A=이전, B=신규로
    nameA = companyNameA + ' ' + verLabelB + ' (이전)';
    nameB = companyNameB + ' ' + verLabelA + ' (신규)';
    resolvedFlowA = flowB;
    resolvedFlowB = flowA;
  } else if (isSameCompany) {
    nameA = companyNameA + (verLabelA ? ' ' + verLabelA + ' (이전)' : ' (이전)');
    nameB = companyNameB + (verLabelB ? ' ' + verLabelB + ' (신규)' : ' (신규)');
    resolvedFlowA = flowA;
    resolvedFlowB = flowB;
  } else {
    nameA = companyNameA;
    nameB = companyNameB;
    resolvedFlowA = flowA;
    resolvedFlowB = flowB;
  }
  covA = calcFlowCoverage(resolvedFlowA);
  covB = calcFlowCoverage(resolvedFlowB);

  const getName = function(code) {
    return (state.screenTypes.find(function(s){return s.code===code;}) || {}).name || code;
  };
  const extra = getAnalysisExtra();

  // 새 프롬프트용 변수 계산
  var comparisonMode = isSameCompany ? 'same_company_version' : 'competitor_same_flow';
  var buildScreenList = function(flow) {
    return flow.map(function(s, i) {
      return (i+1) + '. ' + getName(s.screen_type_code) + '[' + (s.screen_type_code||'?') + '] 순서' + (s.order_no||'?');
    }).join(' / ');
  };
  var screenListA = buildScreenList(resolvedFlowA);
  var screenListB = buildScreenList(resolvedFlowB);
  var setA = resolvedFlowA[0] && resolvedFlowA[0].set;
  var setB = resolvedFlowB[0] && resolvedFlowB[0].set;
  var versionInfoA = ((setA && setA.version) || '') + ((setA && setA.uploaded_at) ? ((setA.version ? ' / ' : '') + setA.uploaded_at) : '') || '정보 없음';
  var versionInfoB = ((setB && setB.version) || '') + ((setB && setB.uploaded_at) ? ((setB.version ? ' / ' : '') + setB.uploaded_at) : '') || '정보 없음';
  var catDisplayNames = { '약관':'약관동의', '인적사항':'인적사항', '차량':'차량정보', '운전자':'운전자정보', '보험료특약':'보험료/특약' };
  var allCatKeys = [];
  resolvedFlowA.concat(resolvedFlowB).forEach(function(s) {
    var cat = FLOW_CATEGORY_MAP[s.screen_type_code];
    if (cat && allCatKeys.indexOf(cat) === -1) allCatKeys.push(cat);
  });
  var flowName = allCatKeys.length > 0 ? allCatKeys.map(function(c){ return catDisplayNames[c]||c; }).join('·') + ' 플로우' : '보험 가입 플로우';
  var allScreenTypeCodes = {};
  resolvedFlowA.concat(resolvedFlowB).forEach(function(s) {
    if (s.screen_type_code && !allScreenTypeCodes[s.screen_type_code]) {
      allScreenTypeCodes[s.screen_type_code] = { name: getName(s.screen_type_code), category: FLOW_CATEGORY_MAP[s.screen_type_code] || '기타' };
    }
  });
  var screenTypeRequirements = Object.entries(allScreenTypeCodes)
    .map(function(e){ return '- [' + e[1].category + '] ' + e[1].name + ' (' + e[0] + ')'; }).join('\n')
    || '(화면 유형 정보 없음)';

  resultWrap.style.display = 'block';
  resultWrap.innerHTML = '<div style="border-top:1px solid var(--border);padding-top:24px;margin-top:8px">' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">' +
    '<div class="spinner"></div>' +
    '<span style="font-size:14px;font-weight:500">플로우 분석 중... ' + (maxTokens >= 4000 ? '(상세)' : '(요약)') + '</span>' +
    '<span style="font-size:14px;color:var(--text-tertiary)">' + AI_MODEL_LABEL + ' · ' + (resolvedFlowA.length + resolvedFlowB.length) + '장 전송</span>' +
    '</div></div>';
  resultWrap.scrollIntoView({behavior:'smooth', block:'start'});

  try {
    const catNames = { '약관':'약관 동의', '인적사항':'인적사항', '차량':'차량 정보', '운전자':'운전자 정보', '보험료특약':'보험료·특약' };
    const covText = function(cov) {
      return Object.entries(cov.catList)
        .map(function(e) { return '- ' + catNames[e[0]] + ': ' + e[1] + '개'; })
        .join('\n');
    };

    const userContent = [];

    let contextText = '두 플로우의 화면 이미지를 순서대로 제공합니다. 각 이미지 앞에 화면 정보 레이블이 붙어 있습니다.';
    if (extra) contextText += '\n\n[추가 분석 요청]\n' + extra;
    userContent.push({type:'text', text: contextText});

    userContent.push({type:'text', text: '\n=== ' + nameA + ' 화면 (' + resolvedFlowA.length + '장) ==='});
    for (var i = 0; i < resolvedFlowA.length; i++) {
      var s = resolvedFlowA[i];
      userContent.push({type:'text', text: 'image A' + (i+1) + ': [' + (s.screen_type_code||'?') + ' / 순서' + (s.order_no||'?') + ' / ' + getName(s.screen_type_code) + '] ' + companyNameA});
      if (s.signed_url) {
        try {
          var b64 = await resizeImageToBase64ForFlow(s.signed_url);
          userContent.push({type:'image', source:{type:'base64', media_type:'image/png', data:b64}});
        } catch(e) { console.warn('이미지 로드 실패:', s.signed_url, e); }
      }
    }

    userContent.push({type:'text', text: '\n=== ' + nameB + ' 화면 (' + resolvedFlowB.length + '장) ==='});
    for (var j = 0; j < resolvedFlowB.length; j++) {
      var sb = resolvedFlowB[j];
      userContent.push({type:'text', text: 'image B' + (j+1) + ': [' + (sb.screen_type_code||'?') + ' / 순서' + (sb.order_no||'?') + ' / ' + getName(sb.screen_type_code) + '] ' + companyNameB});
      if (sb.signed_url) {
        try {
          var b64b = await resizeImageToBase64ForFlow(sb.signed_url);
          userContent.push({type:'image', source:{type:'base64', media_type:'image/png', data:b64b}});
        } catch(e) { console.warn('이미지 로드 실패:', sb.signed_url, e); }
      }
    }

    const promptParams = {
      flowALabel: nameA, flowBLabel: nameB,
      companyA: companyNameA, companyB: companyNameB,
      versionA: versionInfoA, versionB: versionInfoB,
      comparisonMode: comparisonMode, flowName: flowName,
      screenListA: screenListA, screenListB: screenListB,
      screenTypeRequirements: screenTypeRequirements,
    };
    const systemPrompt = maxTokens >= 4000
      ? PROMPTS.FLOW_COMPARE_DETAIL(promptParams)
      : PROMPTS.FLOW_COMPARE_SUMMARY(promptParams);

    const res = await api('POST', '/ai/analyze', {
      system: systemPrompt,
      messages: [{role:'user', content: userContent}],
      max_tokens: maxTokens,
      analysis_type: 'compare'
    });

    if (!res) throw new Error('분석 요청 실패');
    const text = (res.content || []).find(function(b){return b.type==='text';});
    const resultText = text ? text.text : '';
    renderFlowResult(resultWrap, resultText, nameA, nameB, isSameCompany, maxTokens);

  } catch(e) {
    resultWrap.innerHTML = '<div style="border-top:1px solid var(--border);padding-top:24px">' +
      '<div style="color:#C0392B;font-size:14px;padding:16px;background:#FEF2F1;border-radius:var(--radius-md)">플로우 분석 오류: ' + e.message + '</div>' +
      '</div>';
  }
}

function renderFlowResult(wrap, text, nameA, nameB, isSame, maxTokens) {
  maxTokens = maxTokens || 4000;

  function flowBadge(val) {
    var v = val.trim();
    if (v.indexOf('공통 단계') !== -1)                    return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#EAF3DE;color:#3B6D11">공통 단계</span>';
    if (v.indexOf('A만 있음') !== -1)                     return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#E6F1FB;color:#185FA5">A만 있음</span>';
    if (v.indexOf('B만 있음') !== -1)                     return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#EEEDFE;color:#534AB7">B만 있음</span>';
    if (v.indexOf('같은 단계 다른 방식') !== -1)          return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#FAEEDA;color:#854F0B">같은 단계 다른 방식</span>';
    if (v.indexOf('높음') !== -1)                         return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#FCEBEB;color:#A32D2D">높음</span>';
    if (v.indexOf('중간') !== -1)                         return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#FAEEDA;color:#854F0B">중간</span>';
    if (v.indexOf('낮음') !== -1)                         return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#EAF3DE;color:#3B6D11">낮음</span>';
    if (v.indexOf('해상도 문제') !== -1)                  return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#F5F5F5;color:#777">해상도 문제로 확인 어려움</span>';
    if (v === '좋음' || v.indexOf('좋음') !== -1)         return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#EAF3DE;color:#3B6D11">좋음</span>';
    if (v === '보통')                                     return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#F0F0F0;color:#555">보통</span>';
    if (v.indexOf('개선 필요') !== -1)                    return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#FCEBEB;color:#A32D2D">개선 필요</span>';
    if (v.indexOf('확인 어려움') !== -1)                  return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#FAEEDA;color:#854F0B">확인 어려움</span>';
    if (v === '확실함')                                   return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#EAF3DE;color:#3B6D11">확실함</span>';
    if (v.indexOf('부분 확인') !== -1)                    return '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#FAEEDA;color:#854F0B">부분 확인</span>';
    return '<span style="font-size:14px;color:var(--text-secondary)">' + v + '</span>';
  }

  function parseSummaryCards(text) {
    var lines = text.split('\n');
    var summaryStart = -1;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].indexOf('## SUMMARY') === 0) { summaryStart = i; break; }
    }
    if (summaryStart === -1) return '';
    var rows = [];
    for (var i = summaryStart + 1; i < lines.length; i++) {
      var l = lines[i];
      if (l.indexOf('## ') === 0) break;
      if (l.indexOf('|') === 0 && !l.match(/^\|[-| :]+\|$/)) {
        var cells = l.slice(1, -1).split('|').map(function(c){return c.trim();});
        if (cells.length >= 3 && cells[0].indexOf('항목') === -1 && cells[0].indexOf('---') === -1) {
          rows.push(cells);
        }
      }
    }
    if (!rows.length) return '';
    var cards = rows.slice(0, 6).map(function(r) {
      return '<div style="background:var(--gray-50);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px">' +
        '<div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px;font-weight:500">' + (r[0]||'') + '</div>' +
        '<div style="display:flex;gap:10px;align-items:flex-start">' +
          '<div style="flex:1">' +
            '<div style="font-size:10px;color:var(--primary);font-weight:600;margin-bottom:2px">' + nameA + '</div>' +
            '<div style="font-size:13px;font-weight:600;color:var(--text-primary)">' + (r[1]||'-') + '</div>' +
          '</div>' +
          '<div style="color:var(--border);font-size:12px;margin-top:12px">vs</div>' +
          '<div style="flex:1">' +
            '<div style="font-size:10px;color:#534AB7;font-weight:600;margin-bottom:2px">' + nameB + '</div>' +
            '<div style="font-size:13px;font-weight:600;color:var(--text-primary)">' + (r[2]||'-') + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    return '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px">' + cards + '</div>';
  }

  function md2flowReport(t) {
    var lines = t.split('\n');
    var html = '';
    var inTable = false;
    var tableRows = [];
    var tableHeaders = [];
    var sectionIdx = 0;
    var skipSummary = false;
    var sectionColors = [
      {bg:'#FFF0EB',txt:'#FF4600'},
      {bg:'#E6F1FB',txt:'#185FA5'},
      {bg:'#EAF3DE',txt:'#3B6D11'},
      {bg:'#EEEDFE',txt:'#534AB7'},
    ];

    function flushTable() {
      if (!tableRows.length) return;
      var isBadgeTable = tableHeaders.some(function(h){ return h.indexOf('뱃지') !== -1 || h.indexOf('위험도') !== -1 || h.indexOf('상태') !== -1 || h.indexOf('판단') !== -1 || h.indexOf('확인도') !== -1; });
      var thtml = '<div style="overflow-x:auto;border:0.5px solid var(--border);border-radius:var(--radius-md);background:var(--gray-0);margin-bottom:16px">' +
        '<table style="width:100%;border-collapse:collapse;font-size:14px;table-layout:auto">' +
        '<thead><tr style="background:var(--gray-50)">';
      tableHeaders.forEach(function(h) {
        thtml += '<th style="padding:9px 12px;text-align:left;font-weight:500;font-size:13px;color:var(--text-secondary);border-bottom:0.5px solid var(--border);white-space:nowrap">' + h + '</th>';
      });
      thtml += '</tr></thead><tbody>';
      tableRows.forEach(function(row) {
        thtml += '<tr>';
        row.forEach(function(cell, ci) {
          var isBadgeCol = isBadgeTable && tableHeaders[ci] && (tableHeaders[ci].indexOf('뱃지') !== -1 || tableHeaders[ci].indexOf('위험도') !== -1 || tableHeaders[ci].indexOf('상태') !== -1 || tableHeaders[ci].indexOf('판단') !== -1 || tableHeaders[ci].indexOf('확인도') !== -1);
          var cellHtml = isBadgeCol ? flowBadge(cell) : '<span style="color:var(--text-primary)">' + cell + '</span>';
          thtml += '<td style="padding:9px 12px;border-bottom:0.5px solid var(--border);vertical-align:top;line-height:1.5">' + cellHtml + '</td>';
        });
        thtml += '</tr>';
      });
      thtml += '</tbody></table></div>';
      html += thtml;
      tableRows = []; tableHeaders = []; inTable = false;
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];

      if (line.indexOf('## SUMMARY') === 0) { skipSummary = true; continue; }
      if (skipSummary && line.indexOf('## ') === 0) skipSummary = false;
      if (skipSummary) continue;

      if (line.indexOf('## ') === 0) {
        flushTable();
        var title = line.replace('## ', '').trim();
        var sc = sectionColors[sectionIdx % sectionColors.length];
        sectionIdx++;
        html += '<div style="display:flex;align-items:center;gap:8px;margin:' + (sectionIdx > 1 ? '28px' : '0') + ' 0 14px">' +
          '<div style="width:22px;height:22px;border-radius:50%;background:' + sc.bg + ';color:' + sc.txt + ';font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">' + sectionIdx + '</div>' +
          '<div style="font-size:15px;font-weight:600;color:var(--text-primary)">' + title + '</div>' +
          '</div>';
        continue;
      }

      if (line.indexOf('### ') === 0) {
        flushTable();
        html += '<div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin:14px 0 6px;padding:6px 10px;background:var(--gray-50);border-radius:var(--radius-sm)">' + line.replace('### ', '') + '</div>';
        continue;
      }

      if (line.match(/^\|[-| :]+\|$/)) continue;

      if (line.indexOf('|') === 0 && line.lastIndexOf('|') === line.length - 1) {
        var cells = line.slice(1, -1).split('|').map(function(c){return c.trim();});
        if (!inTable) { inTable = true; tableHeaders = cells; }
        else { tableRows.push(cells); }
        continue;
      }

      if (inTable && line.indexOf('|') !== 0) flushTable();

      if (line.indexOf('◆ ') === 0) {
        var rest = line.replace('◆ ', '');
        var isGood = rest.indexOf('잘하') !== -1 || rest.indexOf('강점') !== -1;
        var isBad = rest.indexOf('아쉬') !== -1 || rest.indexOf('문제') !== -1 || rest.indexOf('위험') !== -1 || rest.indexOf('우려') !== -1;
        var dotColor = isGood ? '#3B6D11' : isBad ? '#A32D2D' : '#534AB7';
        html += '<div style="display:flex;align-items:flex-start;gap:8px;padding:10px 14px;background:var(--gray-50);border-radius:var(--radius-md);margin-bottom:6px">' +
          '<div style="width:8px;height:8px;border-radius:50%;background:' + dotColor + ';flex-shrink:0;margin-top:5px"></div>' +
          '<div style="font-size:14px;font-weight:500;color:var(--text-primary)">' + rest + '</div>' +
          '</div>';
        continue;
      }

      if (line.indexOf('→ ') === 0) {
        html += '<div style="display:flex;gap:8px;align-items:flex-start;padding:10px 14px;background:#EAF3DE;border-radius:var(--radius-md);margin-bottom:6px">' +
          '<span style="color:#3B6D11;font-weight:700;flex-shrink:0">→</span>' +
          '<span style="font-size:14px;color:#1F4D0A;font-weight:500">' + line.slice(2) + '</span>' +
          '</div>';
        continue;
      }

      if (line.match(/^[-•·] /)) {
        html += '<div style="display:flex;gap:8px;font-size:14px;color:var(--text-secondary);padding:4px 14px;line-height:1.6">' +
          '<span style="color:var(--text-tertiary);flex-shrink:0">·</span>' +
          '<span>' + line.replace(/^[-•·] /, '') + '</span>' +
          '</div>';
        continue;
      }

      if (line.trim()) {
        html += '<div style="font-size:14px;color:var(--text-secondary);line-height:1.7;margin-bottom:4px;padding:0 2px">' +
          line.replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--text-primary)">$1</strong>') +
          '</div>';
      } else {
        html += '<div style="height:8px"></div>';
      }
    }
    flushTable();
    return html;
  }

  var summaryCards = parseSummaryCards(text);
  var reportBody = md2flowReport(text);
  var modeLabel = isSame ? nameA + ' 버전 비교' : nameA + ' vs ' + nameB;

  wrap.innerHTML =
    '<div id="flow-analysis-report" style="border-top:1px solid var(--border);padding-top:24px;margin-top:8px">' +
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)">' +
        '<div>' +
          '<div style="font-size:18px;font-weight:600;letter-spacing:-0.02em;margin-bottom:4px">AI 플로우 분석 결과</div>' +
          '<div style="font-size:14px;color:var(--text-tertiary)">' + modeLabel + ' · 가입 흐름 5개 카테고리 분석 · ' + (maxTokens >= 4000 ? '상세' : '요약') + '</div>' +
        '</div>' +
        '<button class="btn btn-secondary btn-sm" onclick="downloadFlowReport()" style="flex-shrink:0">' +
          '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 1v7M3 5.5l3 3 3-3M1 10h10"/></svg>' +
          ' 이미지 저장' +
        '</button>' +
      '</div>' +
      summaryCards +
      '<div id="flow-report-body" style="background:var(--gray-0);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 28px">' +
        reportBody +
      '</div>' +
    '</div>';
}

async function downloadFlowReport() {
  var el = document.getElementById('flow-analysis-report');
  if (!el) return;
  toast('이미지 저장 중...');
  try {
    if (!window.html2canvas) {
      await new Promise(function(res, rej) {
        var s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    var canvas = await html2canvas(el, {scale:2, useCORS:true, backgroundColor:'#ffffff'});
    var a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = '플로우분석_' + new Date().toISOString().slice(0,10) + '.png';
    a.click();
    toast('저장 완료!', 'success');
  } catch(e) { toast('저장 실패: ' + e.message, 'error'); }
}

  el.innerHTML = `
    <div class="page-header">

    </div>

    <!-- 화면 선택 영역 -->
    <div style="background:var(--gray-0);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px">

      </div>
      <div id="dp-empty" style="border:2px dashed var(--border);border-radius:var(--radius-md);padding:32px;text-align:center;background:var(--gray-50)">
        <div style="font-size:14px;color:var(--text-secondary);font-weight:500">화면 추가 버튼으로 검수할 화면을 선택하세요</div>
        <div style="font-size:12px;color:var(--text-tertiary);margin-top:4px">단일 화면 또는 여러 화면 플로우 분석 (최대 20장)</div>
      </div>
      <div id="dp-preview" style="display:none">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <div style="font-size:13px;font-weight:500;color:var(--text-primary);flex:1" id="dp-preview-count"></div>
        </div>
        <div id="dp-preview-grid" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
    </div>

    <!-- 추가 분석 요청 -->
    <div style="background:var(--gray-0);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:20px">
      <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:8px">추가 분석 요청 <span style="font-weight:400;color:var(--text-tertiary)">(선택)</span></div>
      <textarea id="dp-extra" placeholder="특별히 집중해서 분석해야 할 부분이 있으면 입력해주세요. 예) 동의 버튼 배치 방식이 잘못된 계층구조에 해당하는지 확인해줘" style="width:100%;box-sizing:border-box;min-height:72px;padding:10px 12px;font-size:14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--gray-50);color:var(--text-primary);resize:vertical;font-family:inherit"></textarea>
    </div>

    <!-- 분석 버튼 -->
    <div style="display:flex;gap:10px;margin-bottom:28px">
      <button class="btn btn-primary" onclick="startDarkpatternAnalysis('ui')" id="dp-btn-ui">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="10" height="10" rx="1.5"/><path d="M4 6.5h5M6.5 4v5"/></svg>
        UI 기반 체크
      </button>
      <button class="btn btn-secondary" onclick="startDarkpatternAnalysis('flow')" id="dp-btn-flow">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h9M8 1.5l3 2.5-3 2.5M2 9h9M5 6.5l-3 2.5 3 2.5"/></svg>
        플로우 기반 체크
      </button>
    </div>

    <!-- 결과 -->
    <div id="dp-result-wrap" style="display:none"></div>
  `;

  // 상태 초기화
  state.dpFiles = [];
  state.dpScreens = [];
}

// 파일 드롭 핸들러
function dpHandleDrop(e) {
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  dpAddFiles(files);
}

function dpHandleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  dpAddFiles(files);
  document.getElementById('dp-file-input').value = '';
}

function dpAddFiles(files) {
  if (!state.dpFiles) state.dpFiles = [];
  const remaining = 20 - state.dpFiles.length;
  const toAdd = files.slice(0, remaining);
  if (files.length > remaining) toast(`최대 20장까지 업로드 가능합니다 (${remaining}장 추가됨)`, 'default');
  toAdd.forEach(f => state.dpFiles.push(f));
  dpRenderPreview();
}

function dpRenderPreview() {
  const files = state.dpFiles || [];
  const screens = state.dpScreens || [];
  const total = files.length + screens.length;
  const previewWrap = document.getElementById('dp-preview');
  const grid = document.getElementById('dp-preview-grid');
  const countEl = document.getElementById('dp-preview-count');
  if (!total) { previewWrap.style.display = 'none'; return; }
  previewWrap.style.display = 'block';
  countEl.textContent = total + '장 선택됨' + (total > 1 ? ' · 순서대로 플로우 분석' : ' · 단일 화면 분석');
  const fileItems = files.map((f, i) => {
    const url = URL.createObjectURL(f);
    return `<div style="position:relative;width:80px;flex-shrink:0">
      <img src="${url}" style="width:80px;height:120px;object-fit:cover;border-radius:var(--radius-md);border:1px solid var(--border)">
      <div style="position:absolute;top:3px;left:3px;background:rgba(0,0,0,0.55);color:#fff;font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px">${i+1}</div>
      <button onclick="dpRemoveFile(${i})" style="position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.55);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="#fff" stroke-width="1.5"><path d="M1 1l6 6M7 1L1 7"/></svg>
      </button>
    </div>`;
  });
  const screenItems = screens.map((s, i) => {
    return `<div style="position:relative;width:80px;flex-shrink:0">
      <img src="${s.signed_url||''}" style="width:80px;height:120px;object-fit:cover;border-radius:var(--radius-md);border:1px solid var(--border)">
      <div style="position:absolute;top:3px;left:3px;background:rgba(0,0,0,0.55);color:#fff;font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px">${files.length+i+1}</div>
      <button onclick="dpRemoveScreen(${i})" style="position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.55);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="#fff" stroke-width="1.5"><path d="M1 1l6 6M7 1L1 7"/></svg>
      </button>
    </div>`;
  });
  grid.innerHTML = [...fileItems, ...screenItems].join('');
}

function dpRemoveFile(idx) {
  state.dpFiles.splice(idx, 1);
  dpRenderPreview();
}

function dpRemoveScreen(idx) {
  state.dpScreens.splice(idx, 1);
  dpRenderPreview();
}

function onPickerApply(btn) {
  const slot = btn.getAttribute('data-slot');
  if (slot === '__dp__') applyDpPickerSelection();
  else applyComparePickerSelection(slot);
}

// 다크패턴 피커 선택 완료
function applyDpPickerSelection() {
  let selected = pickerScreens.filter(s => pickerSelected.has(s.id));
  if (!selected.length && pickerScreens.length > 0) selected = [...pickerScreens];
  selected = selected.sort((a,b) => (a.order_no||0) - (b.order_no||0));
  if (!selected.length) { toast('화면을 선택해주세요', 'error'); return; }
  if (!state.dpScreens) state.dpScreens = [];
  const remaining = 20 - state.dpScreens.length;
  const toAdd = selected.slice(0, remaining);
  if (selected.length > remaining) toast('최대 20장까지 가능합니다', 'default');
  const existingIds = new Set(state.dpScreens.map(s => s.id));
  toAdd.forEach(s => { if (!existingIds.has(s.id)) state.dpScreens.push(s); });
  document.getElementById('picker-overlay')?.remove();
  dpRenderPreview();
}

function dpClearAll() {
  state.dpScreens = [];
  state.dpFiles = [];
  dpRenderPreview();
}

async function startDarkpatternAnalysis(mode) {
  const screens = state.dpScreens || [];
  if (!screens.length) { toast('검수할 화면을 먼저 선택해주세요', 'error'); return; }

  const resultWrap = document.getElementById('dp-result-wrap');
  const extra = (document.getElementById('dp-extra') || {}).value || '';
  const isFlow = mode === 'flow';
  const modeLabel = isFlow ? '플로우 기반 체크' : 'UI 기반 체크';

  resultWrap.style.display = 'block';
  resultWrap.innerHTML = `<div style="border-top:1px solid var(--border);padding-top:24px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <div class="spinner"></div>
      <span style="font-size:14px;font-weight:500">다크패턴 검수 중... (${modeLabel})</span>
      <span style="font-size:14px;color:var(--text-tertiary)">${AI_MODEL_LABEL} · ${screens.length}장</span>
    </div>
  </div>`;
  resultWrap.scrollIntoView({behavior:'smooth', block:'start'});

  try {
    // signed_url → base64 변환
    const toBase64FromUrl = (url) => new Promise((res, rej) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          let w = img.width, h = img.height;
          const MAX_W = 1500, MAX_H = 2000;
          if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
          if (h > MAX_H) { w = Math.round(w * MAX_H / h); h = MAX_H; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          res(canvas.toDataURL('image/png').split(',')[1]);
        } catch(e) { rej(e); }
      };
      img.onerror = () => rej(new Error('이미지 로드 실패'));
      img.src = url;
    });

    // 이미지 메시지 구성
    const userContent = [];
    const context = extra || (isFlow ? '구독 서비스 중도 해지 여정 확인 및 결제 취소' : '디렉토리 탐색 및 서비스 가입/해지 테스트 단계');

    if (isFlow) {
      userContent.push({type:'text', text: `여정 목표(User Goal): ${context}\n여정 이미지 흐름: 아래 ${screens.length}장 이미지 순서대로 분석\n각 화면의 앞뒤 인과관계를 철저히 추적하여, 사용자의 주의를 의도적으로 분산시키는 전술 및 경제적 선택 침해 전술을 종단적(Longitudinal)으로 탐지하고 결과를 보고해주십시오.`});
    } else {
      userContent.push({type:'text', text: `분석 대상 이미지: 아래 화면\n이용자 현재 상황(Context): ${context}\n위의 가이드라인에 근거하여 기만적 UX 요소의 심층 거시 분석을 진행하고 JSON 결과를 반환해주십시오.`});
    }

    for (let i = 0; i < screens.length; i++) {
      const s = screens[i];
      const stName = state.screenTypes.find(st => st.code === s.screen_type_code)?.name || s.screen_type_code || '';
      userContent.push({type:'text', text: `[화면 ${i+1}/${screens.length} · ${stName}]`});
      if (s.signed_url) {
        try {
          const b64 = await toBase64FromUrl(s.signed_url);
          userContent.push({type:'image', source:{type:'base64', media_type:'image/png', data:b64}});
        } catch(e) { console.warn('이미지 로드 실패:', e); }
      }
    }

    const systemPrompt = isFlow ? PROMPTS.DARKPATTERN_FLOW : PROMPTS.DARKPATTERN_UI;

    const imagePaths = screens.map(s => s.signed_url || s.file_path).filter(Boolean);
    const imageIds = screens.map(s => s.id).filter(Boolean);

    const res = await api('POST', '/ai/analyze', {
      system: systemPrompt,
      messages: [{role:'user', content: userContent}],
      max_tokens: 4000,
      analysis_type: 'darkpattern',
      image_paths: imagePaths,
      image_ids: imageIds,
    });

    if (!res) throw new Error('분석 요청 실패');
    const rawText = (res.content || []).find(b => b.type === 'text')?.text || '';
    renderDarkpatternResult(resultWrap, rawText, screens.length, mode);

  } catch(e) {
    resultWrap.innerHTML = `<div style="border-top:1px solid var(--border);padding-top:24px">
      <div style="color:#C0392B;font-size:14px;padding:16px;background:#FEF2F1;border-radius:var(--radius-md)">검수 오류: ${e.message}</div>
    </div>`;
  }
}


function renderDarkpatternResult(wrap, rawText, fileCount, mode) {
  let data = null;
  try {
    const clean = rawText.replace(/```json|```/g, '').trim();
    data = JSON.parse(clean);
  } catch(e) {}

  const modeLabel = mode === 'flow' ? '플로우 기반 체크' : 'UI 기반 체크';
  const fileCountLabel = (typeof fileCount === 'number' && fileCount > 0) ? `${fileCount}장 · ` : '';

  const reportHeader = `
    <div style="margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)">
      <div style="font-size:18px;font-weight:600;letter-spacing:-0.02em;margin-bottom:4px">다크패턴 검수 결과</div>
      <div style="font-size:14px;color:var(--text-tertiary)">${fileCountLabel}${modeLabel} · 금감원·방통위 가이드라인 기준</div>
    </div>`;

  // ── 신규 포맷 (overall_risk 필드 존재) ──
  if (data && 'overall_risk' in data) {
    const riskRank = {'높음':0,'의심':1,'주의':2,'낮음':3,'없음':4};
    const overall = data.overall_risk || '없음';
    const hasDetected = overall === '높음' || overall === '의심';
    const hasCaution = overall === '주의';

    const verdict = hasDetected
      ? {text:'다크패턴 의심 요소가 감지되었습니다.', bg:'#FCEBEB', color:'#A32D2D'}
      : hasCaution
      ? {text:'주의사항이 있습니다.', bg:'#FAEEDA', color:'#854F0B'}
      : {text:'검출된 다크패턴이 없습니다.', bg:'#EAF3DE', color:'#3B6D11'};

    const issues = (data.issues || [])
      .filter(i => ['높음','의심','주의'].includes(i.risk_level))
      .sort((a,b) => (riskRank[a.risk_level]??9)-(riskRank[b.risk_level]??9));

    const riskBadge = (level) => {
      const s = level==='높음' ? 'background:#A32D2D;color:#fff'
        : level==='의심' ? 'background:#FAEEDA;color:#854F0B'
        : level==='주의' ? 'background:#FFF0EB;color:#FF4600'
        : 'background:var(--gray-100);color:var(--text-secondary)';
      return `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;${s}">${escapeHtml(level)}</span>`;
    };

    const summaryText = escapeHtml(data.summary || data.journey_summary || '');
    let bodyHtml = `
      <div style="padding:14px 18px;border-radius:var(--radius-md);margin-bottom:${issues.length?'20px':'0'};background:${verdict.bg}">
        <div style="font-size:14px;font-weight:600;color:${verdict.color};line-height:1.6">${verdict.text}</div>
        ${summaryText ? `<div style="font-size:13px;color:${verdict.color};margin-top:6px;line-height:1.6;opacity:0.85">${summaryText}</div>` : ''}
      </div>`;

    // 플로우 단계 분석
    if (mode === 'flow' && data.steps_analyzed?.length) {
      bodyHtml += `<div style="font-size:14px;font-weight:600;color:var(--text-primary);margin:20px 0 10px">단계별 분석</div>
        <div style="overflow-x:auto;border:0.5px solid var(--border);border-radius:var(--radius-md);margin-bottom:20px">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="background:var(--gray-50)">
              <th style="padding:8px 12px;text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:0.5px solid var(--border);width:60px">단계</th>
              <th style="padding:8px 12px;text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:0.5px solid var(--border)">화면</th>
              <th style="padding:8px 12px;text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:0.5px solid var(--border)">분석 내용</th>
            </tr></thead><tbody>
            ${data.steps_analyzed.map(s => `<tr>
              <td style="padding:8px 12px;border-bottom:0.5px solid var(--border);color:var(--text-tertiary)">${escapeHtml(String(s.step_number??''))}</td>
              <td style="padding:8px 12px;border-bottom:0.5px solid var(--border);font-weight:500;white-space:nowrap">${escapeHtml(s.screen_name||'')}</td>
              <td style="padding:8px 12px;border-bottom:0.5px solid var(--border);color:var(--text-secondary);line-height:1.5">${escapeHtml(s.finding||'')}</td>
            </tr>`).join('')}
          </tbody></table>
        </div>`;
    }

    // 이슈 카드
    issues.forEach((issue, idx) => {
      bodyHtml += `
        <div style="border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span style="font-size:13px;color:var(--text-tertiary);font-weight:500">${idx+1}.</span>
            <span style="font-size:14px;font-weight:600;color:var(--text-primary)">${escapeHtml(issue.title||'')}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:7px;font-size:13px">
            <div style="display:flex;align-items:baseline;gap:8px">
              <span style="color:var(--text-tertiary);min-width:68px;flex-shrink:0">위험도</span>
              ${riskBadge(issue.risk_level||'')}
            </div>
            <div style="display:flex;align-items:flex-start;gap:8px">
              <span style="color:var(--text-tertiary);min-width:68px;flex-shrink:0">내용</span>
              <span style="color:var(--text-secondary);line-height:1.6">${escapeHtml(issue.content||'')}</span>
            </div>
            <div style="display:flex;align-items:baseline;gap:8px">
              <span style="color:var(--text-tertiary);min-width:68px;flex-shrink:0">의심 유형</span>
              <span style="font-size:12px;padding:2px 8px;border-radius:3px;background:var(--gray-100);color:var(--text-secondary)">${escapeHtml(issue.dark_pattern_type||'')}</span>
            </div>
          </div>
        </div>`;
    });

    if (data.common_pattern) {
      bodyHtml += `
        <div style="margin-top:16px;padding:12px 16px;background:var(--gray-50);border-radius:var(--radius-md);font-size:13px;color:var(--text-secondary);line-height:1.6">
          <span style="font-weight:600;color:var(--text-primary)">공통 요약</span> · ${escapeHtml(data.common_pattern)}
        </div>`;
    }

    wrap.innerHTML = `<div id="dp-analysis-report" style="border-top:1px solid var(--border);padding-top:24px">
      ${reportHeader}
      <div id="dp-report-body" style="background:var(--gray-0);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 28px">
        ${bodyHtml}
      </div>
    </div>`;
    return;
  }

  // ── 구 포맷 호환 (risk_level: HIGH/MEDIUM/LOW) ──
  if (data) {
    const riskColor = (level) => {
      if (level === 'HIGH') return {bg:'#FCEBEB', color:'#A32D2D'};
      if (level === 'MEDIUM') return {bg:'#FAEEDA', color:'#854F0B'};
      return {bg:'#EAF3DE', color:'#3B6D11'};
    };
    const overallRisk = data.risk_level || 'LOW';
    const rc = riskColor(overallRisk);
    let bodyHtml = `<div style="padding:16px 20px;background:${rc.bg};border-radius:var(--radius-md);margin-bottom:20px;display:flex;align-items:flex-start;gap:12px">
      <span style="font-size:12px;font-weight:700;padding:3px 10px;border-radius:3px;background:${rc.color};color:#fff;flex-shrink:0;margin-top:2px">${overallRisk}</span>
      <div style="font-size:14px;color:${rc.color};font-weight:500;line-height:1.6">${data.summary || data.journey_summary || ''}</div>
    </div>`;
    if (mode === 'flow' && data.steps_analyzed?.length) {
      bodyHtml += `<div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:10px">단계별 분석</div>
        <div style="overflow-x:auto;border:0.5px solid var(--border);border-radius:var(--radius-md);margin-bottom:20px">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="background:var(--gray-50)">
              <th style="padding:8px 12px;text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:0.5px solid var(--border);width:60px">단계</th>
              <th style="padding:8px 12px;text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:0.5px solid var(--border)">화면</th>
              <th style="padding:8px 12px;text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:0.5px solid var(--border)">분석 내용</th>
            </tr></thead><tbody>
            ${data.steps_analyzed.map(s => `<tr>
              <td style="padding:8px 12px;border-bottom:0.5px solid var(--border);color:var(--text-tertiary);font-family:var(--font-mono)">${s.step_number}</td>
              <td style="padding:8px 12px;border-bottom:0.5px solid var(--border);font-weight:500;white-space:nowrap">${s.screen_name}</td>
              <td style="padding:8px 12px;border-bottom:0.5px solid var(--border);color:var(--text-secondary);line-height:1.5">${s.finding}</td>
            </tr>`).join('')}
          </tbody></table>
        </div>`;
    }
    if (data.issues?.length) {
      bodyHtml += `<div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:10px">감지된 이슈 (${data.issues.length}건)</div>`;
      data.issues.forEach(issue => {
        const ic = riskColor(issue.risk_level || 'LOW');
        const typeName = issue.dark_pattern_type || issue.flow_pattern_type || '';

// 레이지 이미지 로딩 (Intersection Observer)
// ══════════════════════════════════════════════════════════
const _signedUrlCache = new Map(); // imgsrc → signed URL 캐시 (1시간)

async function getSignedUrl(imgsrc) {
  if (!imgsrc) return null;
  const cached = _signedUrlCache.get(imgsrc);
  if (cached && cached.expires > Date.now()) return cached.url;
  try {
    const res = await api('POST', '/storage/signed-url', { imgsrc });
    if (res?.signed_url) {
      _signedUrlCache.set(imgsrc, { url: res.signed_url, expires: Date.now() + 3500000 });
      return res.signed_url;
    }
  } catch(e) { /* 실패 시 null 반환 */ }
  return null;
}

const _lazyObserver = new IntersectionObserver((entries) => {
  entries.forEach(async (entry) => {
    if (!entry.isIntersecting) return;
    const img = entry.target;
    const imgsrc = img.dataset.lazySrc;
    if (!imgsrc) return;
    _lazyObserver.unobserve(img);
    img.classList.add('lazy-loading');
    // signed_url이 이미 있으면 바로 사용
    const cachedUrl = _signedUrlCache.get(imgsrc);
    if (cachedUrl && cachedUrl.expires > Date.now()) {
      img.src = cachedUrl.url;
      img.classList.remove('lazy-loading');
      return;
    }
    // Edge Function에서 직접 signed URL 받아오기
    // (기존 screen 데이터에 signed_url이 있으면 그걸 그대로 사용)
    img.src = img.dataset.lazySrc; // fallback은 원본 경로
    img.classList.remove('lazy-loading');
  });
}, { rootMargin: '200px' }); // 뷰포트 200px 전에 미리 로딩

// lazy-src가 있는 img를 observe 등록하는 헬퍼
function observeLazyImages(container) {
  const imgs = (container || document).querySelectorAll('img[data-lazy-src]');
  imgs.forEach(img => {
    if (img.dataset.lazySrc && !img.src) {
      _lazyObserver.observe(img);
    }
  });
}

// signed_url을 받아서 img 태그 생성하는 헬퍼
function lazyImg(signedUrl, imgsrc, extraStyle='', extraAttr='') {
  if (signedUrl) {
    // signed URL 캐시에 저장
    if (imgsrc) _signedUrlCache.set(imgsrc, { url: signedUrl, expires: Date.now() + 3500000 });
    return '<img src="' + signedUrl + '" loading="lazy"' + (extraStyle ? ' style="' + extraStyle + '"' : '') + (extraAttr ? ' ' + extraAttr : '') + '>';
  }
  if (imgsrc) {
    return '<img data-lazy-src="' + imgsrc + '" loading="lazy"' + (extraStyle ? ' style="' + extraStyle + '"' : '') + (extraAttr ? ' ' + extraAttr : '') + '>';
  }
  return '<span class="no-img">없음</span>';
}

  body.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  try {
    let screens=[];
    if(company&&type&&subtype){
      const inclRel = pickerSlot==='__relation__' ? '&include_related=true' : ''; const sets=await api('GET',`/screen-sets?company=${company}&type=${type}&subtype=${subtype}&latest_only=false${inclRel}`);

      if(vSel&&sets) vSel.innerHTML=`<option value="">버전 전체</option>`+sets.map(s=>`<option value="${s.version}" ${version===s.version?'selected':''}>${s.version} (${s.uploaded_at})</option>`).join('');
      let targetSets=sets||[];

      if(screen_type)screens=screens.filter(s=>s.screen_type_code===screen_type);

        screens=await api('GET',`/screens?screen_type=${screen_type}&company=${company}${inclRelParam}`)||[];
      } else {
        const sets=await api('GET',`/screen-sets?company=${company}&latest_only=true`)||[];

          // 연관모드: include_related=true로 9000번대 포함
          const inclRelParam = isRelationMode ? '?include_related=true' : '';

    } else if(screen_type){screens=await api('GET',`/screens?screen_type=${screen_type}`)||[];}
    const seen=new Set();screens=screens.filter(s=>{if(seen.has(s.id))return false;seen.add(s.id);return true;});
    screens.sort((a,b)=>a.order_no-b.order_no);

    if(!screens.length){body.innerHTML='<div class="picker-empty"><span>조건에 맞는 화면이 없습니다</span></div>';return;}
    // 피커 렌더 후 레이지 observe (아래 innerHTML 세팅 후 처리)
  body.innerHTML=`<div class="picker-grid">${screens.map(s=>{
      const stName=state.screenTypes.find(st=>st.code===s.screen_type_code)?.name||s.screen_type_code;
      const companyName=state.companies.find(c=>c.code===s.set?.company_code)?.name||'';

// 4번: 파일명에서 화면유형 코드 자동 매칭
function guessScreenTypeFromFilename(filename){
  const upper=filename.toUpperCase().replace(/\.[^.]+$/,'');
  const tokens=upper.split(/[_\-\s\.]+/);
  for(const st of state.screenTypes){
    const code=st.code.toUpperCase();
    if(tokens.includes(code))return st.code;
  }
  const sorted=[...state.screenTypes].sort((a,b)=>b.code.length-a.code.length);
  for(const st of sorted){
    if(upper.includes(st.code.toUpperCase()))return st.code;
  }
  return '';
}

// 파일명에서 모든 메타정보 자동 추출
// 규칙: {기업코드}_{유형코드}_{유형상세코드}_{화면유형코드}_{버전}_{순서}.ext
function parseFilename(filename){
  const base = filename.replace(/\.[^.]+$/, ''); // 확장자 제거
  const tokens = base.split('_');
  const result = {company:'', type:'', subtype:'', screenType:'', version:'', order:0};

  // 기업코드 매칭 (1번째 토큰)
  const companyMatch = state.companies.find(c => tokens[0]?.toUpperCase() === c.code.toUpperCase());
  if (companyMatch) result.company = companyMatch.code;

  // 유형코드 매칭 (2번째 토큰)
  const typeMatch = state.types.find(t => tokens[1]?.toUpperCase() === t.code.toUpperCase());
  if (typeMatch) result.type = typeMatch.code;

  // 유형상세코드 매칭 - 하이픈 포함 가능하므로 여러 토큰 조합 시도
  // 예: HW-CAR-CM → 토큰이 ['HW', 'CAR', 'CM'] 일 수도 있고 ['HW-CAR-CM'] 일 수도 있음
  if (result.company && result.type) {
    const remaining = tokens.slice(2).join('_');
    // 가장 긴 유형상세코드부터 매칭 시도
    const sortedSub = [...state.subtypes].sort((a,b)=>b.code.length-a.code.length);
    for (const s of sortedSub) {
      const codeUpper = s.code.toUpperCase();
      const remainUpper = remaining.toUpperCase();
      if (remainUpper.startsWith(codeUpper + '_') || remainUpper === codeUpper) {
        result.subtype = s.code;
        // 유형상세 이후 토큰 파싱
        const afterSubtype = remaining.slice(s.code.length + 1); // +1 for underscore
        const afterTokens = afterSubtype.split('_');
        // 화면유형코드 매칭
        result.screenType = guessScreenTypeFromFilename(afterSubtype);
        // 버전 매칭 (V1, V2 등)
        const versionToken = afterTokens.find(t => /^V\d+$/i.test(t));
        if (versionToken) result.version = versionToken.toUpperCase();
        // 순서 매칭 (숫자만)
        const orderToken = afterTokens.find(t => /^\d+$/.test(t));
        if (orderToken) result.order = parseInt(orderToken);
        break;
      }
    }
  }

  // 버전/순서가 안 잡혔으면 전체 토큰에서 재시도
  if (!result.version) {
    const vt = tokens.find(t => /^V\d+$/i.test(t));
    if (vt) result.version = vt.toUpperCase();
  }
  if (!result.order) {
    const ot = tokens.find(t => /^\d{2,3}$/.test(t));
    if (ot) result.order = parseInt(ot);
  }

  return result;
}

// 파일 목록에서 공통 메타정보 추출 (기업/유형/유형상세/버전)
function detectCommonMeta(files){
  const parsed = Array.from(files).map(f => parseFilename(f.name));
  const companies = [...new Set(parsed.map(p=>p.company).filter(Boolean))];
  const types = [...new Set(parsed.map(p=>p.type).filter(Boolean))];
  const subtypes = [...new Set(parsed.map(p=>p.subtype).filter(Boolean))];
  const versions = [...new Set(parsed.map(p=>p.version).filter(Boolean))];
  return {
    company: companies.length === 1 ? companies[0] : '',
    type: types.length === 1 ? types[0] : '',
    subtype: subtypes.length === 1 ? subtypes[0] : '',
    version: versions.length === 1 ? versions[0] : '',
  };
}

function buildSubtypeOptions() {
  // order_no 앞자리 기준으로 그룹핑 (없으면 단순 목록)
  // type 이름을 prefix로 활용
  const typeMap = {};
  state.types.forEach(t => { typeMap[t.code] = t.name; });

  // subtype code에서 type code 추출 시도 (예: HWS_NEW → HWS)
  // 안되면 단순 목록으로
  const grouped = {};
  state.subtypes.forEach(s => {
    // order_no 기준 그룹 (10단위)
    const groupKey = Math.floor((s.order_no||99) / 10) * 10;
    const groupLabel = Object.values(typeMap)[Math.floor(groupKey/10)] || '기타';
    if (!grouped[groupLabel]) grouped[groupLabel] = [];
    grouped[groupLabel].push(s);
  });

  const groups = Object.entries(grouped);
  if (groups.length <= 1) {
    // 그룹 의미없으면 그냥 목록
    return state.subtypes.map(s =>
      `<option value="${s.code}">${s.name}</option>`
    ).join('');
  }
  return groups.map(([label, items]) =>
    `<optgroup label="${label}">${items.map(s=>`<option value="${s.code}">${s.name}</option>`).join('')}</optgroup>`
  ).join('');
}

function autoDetectFromFiles(files){
  const meta = detectCommonMeta(files);
  let detected = [];

  if(meta.company){
    document.getElementById('up-company').value = meta.company;
    state.uploadMeta.company = meta.company;
    detected.push('기업: '+( state.companies.find(c=>c.code===meta.company)?.name||meta.company));
  }
  if(meta.type){
    document.getElementById('up-type').value = meta.type;
    state.uploadMeta.type = meta.type;
    detected.push('유형: '+(state.types.find(t=>t.code===meta.type)?.name||meta.type));
  }
  if(meta.subtype){
    document.getElementById('up-subtype').value = meta.subtype;
    state.uploadMeta.subtype = meta.subtype;
    detected.push('유형상세: '+(state.subtypes.find(s=>s.code===meta.subtype)?.name||meta.subtype));
  }
  const resultEl = document.getElementById('step1-detect-result');
  if(resultEl){
    if(detected.length){
      resultEl.style.display = 'block';
      resultEl.innerHTML = '<strong>자동 감지됨:</strong> '+detected.join(' · ')
        +(detected.length < 3 ? ' · <span style="color:var(--text-secondary)">나머지는 직접 입력해주세요</span>' : '');
      toast('기본 정보가 자동으로 채워졌어요!', 'success');
    } else {
      resultEl.style.display = 'block';
      resultEl.style.background = 'var(--gray-100)';
      resultEl.style.color = 'var(--text-tertiary)';
      resultEl.textContent = '파일명에서 정보를 감지하지 못했어요. 직접 입력해주세요.';
    }
  }

  // 파일도 바로 업로드 목록에 추가
  addFiles(files);
}

function addFiles(files){
  // 파일명 순서(숫자) 기준 정렬
  const sorted = Array.from(files).filter(f=>f.type.startsWith('image/')).sort((a,b)=>{
    const na = a.name.match(/\d+/g)?.map(Number)||[];
    const nb = b.name.match(/\d+/g)?.map(Number)||[];
    for(let i=0;i<Math.max(na.length,nb.length);i++){
      const diff=(na[i]||0)-(nb[i]||0);
      if(diff!==0)return diff;
    }
    return a.name.localeCompare(b.name);
  });
  sorted.forEach(f=>{
    // 중복 방지
    if(state.uploadFiles.find(u=>u.file.name===f.name&&u.file.size===f.size))return;
    const parsed = parseFilename(f.name);
    const autoCode = parsed.screenType || guessScreenTypeFromFilename(f.name);
    state.uploadFiles.push({file:f, status:'pending', screenTypeCode:autoCode, parsedOrder:parsed.order, isRelated:false});
  });
  // parsedOrder 기준 재정렬
  state.uploadFiles.sort((a,b)=>(a.parsedOrder||0)-(b.parsedOrder||0));
  renderUploadPreviews();
}

      </div>

}

async function computeFileHash(file) {
  const buffer = await file.arrayBuffer();
  const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function startUpload(){
  const meta=state.uploadMeta;
  const untyped=state.uploadFiles.filter(f=>!f.screenTypeCode);
  if(untyped.length)return toast('모든 화면의 화면유형을 선택해주세요','error');

  const mainFiles=state.uploadFiles.filter(f=>!f.isRelated);
  const relatedFiles=state.uploadFiles.filter(f=>f.isRelated);
  let setId=null;

  // 메인 플로우 업로드 (order_no: 1, 2, 3...)
  for(let i=0;i<mainFiles.length;i++){
    const item=mainFiles[i]; item.status='uploading'; renderUploadPreviews();
    try{
      const orderNo=i+1;
      const ext=item.file.name.split('.').pop()||'png';
      const contentHash=await computeFileHash(item.file);
      const urlRes=await api('POST','/storage/upload-url',{company_code:meta.company,type_code:meta.type,subtype_code:meta.subtype,screen_type_code:item.screenTypeCode,order_no:orderNo,content_hash:contentHash,ext});
      await fetch(urlRes.upload_url,{method:'PUT',body:item.file,headers:{'Content-Type':item.file.type}});
      const result=await api('POST','/screens/upsert',{company_code:meta.company,type_code:meta.type,subtype_code:meta.subtype,screen_type_code:item.screenTypeCode,order_no:orderNo,imgsrc:urlRes.file_path,content_hash:contentHash,uploaded_at:meta.date});
      if(!setId&&result.set_id) setId=result.set_id;
      item.status='done'; item.resultMsg=result.message;
    }catch(e){item.status='error';}
    renderUploadPreviews();
  }

  // 연관 화면 업로드 (order_no: 9000+)
  let relatedStartOrder=9000;
  if(setId){
    try{
      const setDetail=await api('GET',`/screen-sets/${setId}`);
      const existingRelated=(setDetail?.screens||[]).filter(s=>s.order_no>=9000);
      if(existingRelated.length>0) relatedStartOrder=Math.max(...existingRelated.map(s=>s.order_no))+1;
    }catch(e){}
  }

  const relatedScreenIds=[];
  for(let i=0;i<relatedFiles.length;i++){
    const item=relatedFiles[i]; item.status='uploading'; renderUploadPreviews();
    try{
      const orderNo=relatedStartOrder+i;
      const ext=item.file.name.split('.').pop()||'png';
      const contentHash=await computeFileHash(item.file);
      const urlRes=await api('POST','/storage/upload-url',{company_code:meta.company,type_code:meta.type,subtype_code:meta.subtype,screen_type_code:item.screenTypeCode,order_no:orderNo,content_hash:contentHash,ext});
      await fetch(urlRes.upload_url,{method:'PUT',body:item.file,headers:{'Content-Type':item.file.type}});
      const result=await api('POST','/screens/upsert',{company_code:meta.company,type_code:meta.type,subtype_code:meta.subtype,screen_type_code:item.screenTypeCode,order_no:orderNo,imgsrc:urlRes.file_path,content_hash:contentHash,uploaded_at:meta.date});
      if(!setId&&result.set_id) setId=result.set_id;
      if(result.screen_id) relatedScreenIds.push(result.screen_id);
      item.status='done';
    }catch(e){item.status='error';}
    renderUploadPreviews();
  }

  // 연관 화면 자동 연결
  if(relatedScreenIds.length>0&&setId){
    try{
      const setDetail=await api('GET',`/screen-sets/${setId}`);
      const mainScreens=(setDetail?.screens||[]).filter(s=>s.order_no<9000).sort((a,b)=>a.order_no-b.order_no);
      if(mainScreens.length>0){
        const targetScreenId=mainScreens[mainScreens.length-1].id;
        for(const relId of relatedScreenIds){
          try{await api('POST','/screen-relations',{screen_id:targetScreenId,related_screen_id:relId});}catch(e){}
        }
        toast(`연관 화면 ${relatedScreenIds.length}개가 자동 연결됐습니다`,'success');
      }
    }catch(e){console.warn('연관 화면 자동 연결 실패:',e);}
  }

  const relatedCount=relatedFiles.filter(f=>f.status==='done').length;
  document.getElementById('upload-step-2').style.display='none';document.getElementById('upload-step-3').style.display='block';
  document.getElementById('step-2').classList.remove('active');document.getElementById('step-2').classList.add('done');
  document.getElementById('step-3').classList.add('active');
  document.getElementById('upload-done-desc').textContent=`메인 ${mainFiles.filter(f=>f.status==='done').length}장${relatedCount?` · 연관 화면 ${relatedCount}장`:''} 등록됐습니다`;
  toast('업로드 완료!','success');
}

// 이미지 URL → Canvas 리사이즈 → base64
async function resizeImageToBase64ForFlow(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        let {width: w, height: h} = img;
        // 가로 1500px 이하로 제한 (텍스트 밀도 유지)
        // 세로는 2000px 이하로만 제한 (API 한도)
        const MAX_W = 1500;
        const MAX_H = 2000;
        if (w > MAX_W) {
          const ratio = MAX_W / w;
          w = MAX_W;
          h = Math.round(h * ratio);
        }
        if (h > MAX_H) {
          const ratio = MAX_H / h;
          h = MAX_H;
          w = Math.round(w * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const base64 = canvas.toDataURL('image/png').split(',')[1];
        resolve(base64);
      } catch(e) { reject(e); }
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function resizeImageToBase64(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        let {width: w, height: h} = img;
        // 세로만 7500px 제한 (가로 원본 유지 - 텍스트 판독 품질 보장)
        // TODO: 7500px 초과 긴 화면은 상단/중간/하단으로 분할 전송하여 수치 판독 정확도 향상
        if (h > 7500) {
          const ratio = 7500 / h;
          w = Math.round(w * ratio);
          h = 7500;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        // PNG로 변환 (텍스트 선명도 유지)
        const base64 = canvas.toDataURL('image/png').split(',')[1];
        resolve(base64);
      } catch(e) { reject(e); }
    };
    img.onerror = reject;
    img.src = url;
  });
}

function renameUpdatePreview() {
  const el = document.getElementById('rn-preview');
  if (!el) return;
  const {company, type, subtype, version} = renameMeta;
  if (company && type && subtype && version) {
    el.style.display = 'block';
    el.textContent = `${company}_${type}_${subtype}_{화면유형코드}_${version}_001.png`;
  } else {
    el.style.display = 'none';
  }
}

function renameGoStep(step) {
  if (step === 2) {
    const {company, type, subtype, version} = renameMeta;
    if (!company || !type || !subtype || !version) return toast('모든 항목을 선택해주세요', 'error');
  }
  renameStep = step;
  // 스텝 바 업데이트
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById(`rename-step-${i}`);
    if (!el) continue;
    const num = el.querySelector('span');
    if (i < step) {
      el.style.background = 'var(--gray-50)';
      el.style.color = 'var(--text-tertiary)';
      if (num) { num.style.background = '#EAF3DE'; num.style.color = '#1A7F3C'; num.textContent = '✓'; }
    } else if (i === step) {
      el.style.background = 'var(--gray-0)';
      el.style.color = 'var(--text-primary)';
      if (num) { num.style.background = 'var(--primary)'; num.style.color = 'white'; num.textContent = i; }
    } else {
      el.style.background = 'var(--gray-50)';
      el.style.color = 'var(--text-tertiary)';
      if (num) { num.style.background = 'var(--gray-200)'; num.style.color = 'var(--text-tertiary)'; num.textContent = i; }
    }
  }
  // 섹션 토글
  for (let i = 1; i <= 4; i++) {
    const sec = document.getElementById(`rename-sec-${i}`);
    if (sec) sec.style.display = i === step ? 'block' : 'none';
  }
  // STEP 3 진입 시 그리드 렌더
  if (step === 3) renameRenderAssignGrid();
  if (step === 4) renameRenderResult();
}

function renameHandleDrop(e) { renameHandleFiles(e.dataTransfer.files); }
function renameHandleFiles(files) {
  const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
  // 파일명 숫자 순 정렬
  arr.sort((a, b) => {
    const na = a.name.match(/\d+/g)?.map(Number) || [];
    const nb = b.name.match(/\d+/g)?.map(Number) || [];
    for (let i = 0; i < Math.max(na.length, nb.length); i++) {
      const diff = (na[i] || 0) - (nb[i] || 0);
      if (diff !== 0) return diff;
    }
    return a.name.localeCompare(b.name);
  });
  renameFiles = arr.map((f, i) => ({
    file: f,
    order: i + 1,
    screenTypeCode: renameGuessType(f.name),
    url: URL.createObjectURL(f),
  }));
  renameRenderFileGrid();
  document.getElementById('rn-file-count').textContent = `${renameFiles.length}개 선택됨`;
  const btn = document.getElementById('rn-btn-step3');
  if (btn) btn.disabled = renameFiles.length === 0;
}

function renameGuessType(filename) {
  const upper = filename.toUpperCase().replace(/\.[^.]+$/, '');
  const tokens = upper.split(/[_\-\s\.]+/);
  for (const st of state.screenTypes) {
    if (tokens.includes(st.code.toUpperCase())) return st.code;
  }
  const sorted = [...state.screenTypes].sort((a, b) => b.code.length - a.code.length);
  for (const st of sorted) {
    if (upper.includes(st.code.toUpperCase())) return st.code;
  }
  return '';
}

function renameGetNewName(item) {
  const {company, type, subtype, version} = renameMeta;
  const code = item.screenTypeCode || 'UNKNOWN';
  const order = String(item.order).padStart(3, '0');
  const ext = item.file.name.split('.').pop() || 'png';
  return `${company}_${type}_${subtype}_${code}_${version}_${order}.${ext}`;
}

function renameGetStOptions() {
  const grouped = {};
  state.screenTypes.forEach(s => {
    const cat = s.category || '기타';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(s);
  });
  return Object.entries(grouped).map(([cat, items]) =>
    `<optgroup label="${cat}">${items.map(s => `<option value="${s.code}">${s.name}</option>`).join('')}</optgroup>`
  ).join('');
}

function renameAutoMatch() {
  renameFiles.forEach((item, i) => {

function renameCopyAll() {
  const names = renameFiles.map(f => renameGetNewName(f)).join('\n');

}

async function renameDownloadZip() {
  if (typeof JSZip === 'undefined') {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  toast('ZIP 생성 중...');
  const zip = new JSZip();
  for (const item of renameFiles) {
    const arrayBuffer = await item.file.arrayBuffer();
    zip.file(renameGetNewName(item), arrayBuffer);
  }
  const blob = await zip.generateAsync({type:'blob'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `renamed_${renameMeta.company}_${renameMeta.subtype}_${renameMeta.version}.zip`;
  a.click();
  toast('ZIP 다운로드 완료!', 'success');
}
